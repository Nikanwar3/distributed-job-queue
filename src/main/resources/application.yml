spring:
  application:
    name: distributed-job-queue

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jobqueue}
    username: ${DB_USER:jobqueue}
    password: ${DB_PASSWORD:jobqueue}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

jobqueue:
  worker-enabled: ${WORKER_ENABLED:true}
  worker-concurrency: ${WORKER_CONCURRENCY:4}
  consumer-batch-size: ${CONSUMER_BATCH_SIZE:10}
  consumer-block-ms: ${CONSUMER_BLOCK_MS:5000}
  default-max-retries: ${DEFAULT_MAX_RETRIES:3}
  default-timeout-seconds: ${DEFAULT_TIMEOUT_SECONDS:30}
  recovery-interval-ms: ${RECOVERY_INTERVAL_MS:15000}
  recovery-min-idle-ms: ${RECOVERY_MIN_IDLE_MS:60000}
  delayed-retry-interval-ms: ${DELAYED_RETRY_INTERVAL_MS:1000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
